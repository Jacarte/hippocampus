name: Release

on:
  push:
    branches: [main]

jobs:
  # Check whether a release for the current VERSION already exists.
  # If it does, the subsequent jobs are skipped (exit 0 — no failure).
  check-release:
    runs-on: ubuntu-latest
    outputs:
      # "true" → release already published; build/publish jobs will skip
      already-released: ${{ steps.check.outputs.already-released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether release v${{ steps.version.outputs.version }} exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # `gh release view` exits non-zero when the release does not exist.
          # We intentionally suppress any error so the workflow step succeeds
          # either way; the flag is communicated via the output variable.
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping publish."
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${VERSION} not found — proceeding with build & publish."
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release
    # Skip the entire build matrix when the release already exists.
    if: needs.check-release.outputs.already-released == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: m0grep-linux-amd64
          - os: macos-13          # Intel / amd64
            target: x86_64-apple-darwin
            artifact: m0grep-macos-amd64
          - os: macos-14          # Apple Silicon / arm64
            target: aarch64-apple-darwin
            artifact: m0grep-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build m0grep
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Rename binary to artifact name
        run: |
          cp cli/target/${{ matrix.target }}/release/m0grep ${{ matrix.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: [check-release, build]
    if: needs.check-release.outputs.already-released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: v${{ needs.check-release.outputs.version }}
          files: |
            artifacts/m0grep-linux-amd64/m0grep-linux-amd64
            artifacts/m0grep-macos-amd64/m0grep-macos-amd64
            artifacts/m0grep-macos-arm64/m0grep-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
