[package]
name = "m0grep"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m0grep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
notify = { version = "6", features = ["macos_kqueue"] }
ctrlc = "3"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serial_test = "3"
mockito = "1"
tempfile = "3"
