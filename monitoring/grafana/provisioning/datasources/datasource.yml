apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
  # Read-only lookup of memory text for the Hot Memories dashboard.
  # Role grafana_ro is created by the compose service grafana-pg-init (fallback: ./monitoring/postgres/create-grafana-ro.sh)
  # (SELECT on mem0_memories.id and .payload only).
  - name: Mem0 Postgres (read-only)
    uid: mem0-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: false
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
