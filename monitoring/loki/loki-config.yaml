# Single-node Loki for mem0 query events. Filesystem storage under /loki
# (bind-mounted from ${DATA_PATH:-./data}/loki). No auth: the Loki port is not
# published, only Grafana and Alloy reach it over mem0-network.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention: the compactor deletes data older than limits_config.retention_period.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 336h # 14 days
  reject_old_samples: true
  reject_old_samples_max_age: 336h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_label_names_per_series: 15
  max_query_series: 2000
  max_entries_limit_per_query: 5000
  query_timeout: 1m
  # Do not auto-add a service_name label; Alloy already sets service.
  discover_service_name: []

analytics:
  reporting_enabled: false
