services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mem0-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mem0-network
    restart: unless-stopped
    labels:
      com.example.description: "PostgreSQL database with pgvector for mem0"
    security_opt:
      - no-new-privileges:true
  mem0-cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: mem0-cms
    image: mem0-cms:latest
    ports:
      - "${CMS_PORT:-8080}:80"
    environment:
      MEM0_SERVER_URL: http://mem0-server:8000
    networks:
      - mem0-network
    restart: unless-stopped
    depends_on:
      mem0-server:
        condition: service_healthy
    labels:
      com.example.description: "Mem0 CMS admin interface"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  mem0-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: mem0-server
    image: mem0-server:latest
    ports:
      - "${MEM0_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Vector Store Configuration
      MEM0_VECTOR_PROVIDER: ${MEM0_VECTOR_PROVIDER:-pgvector}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_COLLECTION: ${POSTGRES_COLLECTION:-mem0_memories}

      # LLM Configuration
      MEM0_LLM_PROVIDER: ${MEM0_LLM_PROVIDER:-litellm}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-bedrock-nvidia-nemotron-super-3-120b}
      MEM0_LLM_TEMPERATURE: ${MEM0_LLM_TEMPERATURE:-0.7}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MEM0_LLM_EXTRA_CONFIG: ${MEM0_LLM_EXTRA_CONFIG:-}

      # LITELLM
      LITELLM_API_BASE: ${LITELLM_API_BASE:-https://gateway.prd.devtools.trustly.cloud/v1}

      # OLLAMA
      MEM0_OLLAMA_HOST: ${MEM0_OLLAMA_HOST:-http://host.docker.internal:11434}

      # Embedder Configuration
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-ollama}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-mxbai-embed-large}

      # Server Configuration
      MEM0_HOST: 0.0.0.0
      MEM0_PORT: 8000
      MEM0_WORKERS: ${MEM0_WORKERS:-4}
      MEM0_LOG_LEVEL: ${MEM0_LOG_LEVEL:-info}
      MEM0_HISTORY_DB_PATH: /var/lib/mem0/history.db

      # Recency-decay ranking (affects /retrieve reranking only, not /search)
      MEM0_RETRIEVAL_DECAY_ENABLED: ${MEM0_RETRIEVAL_DECAY_ENABLED:-true}
      MEM0_RETRIEVAL_DECAY_WEIGHT: ${MEM0_RETRIEVAL_DECAY_WEIGHT:-0.05}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .env:/app/.env:ro
      - mem0_history:/var/lib/mem0
    networks:
      - mem0-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      com.example.description: "Mem0 REST API server"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mem0-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - mem0-network
    restart: unless-stopped
    depends_on:
      mem0-server:
        condition: service_healthy
    labels:
      com.example.description: "Prometheus metrics scraper for mem0-server"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mem0-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Read-only Postgres datasource mem0-pg (role created by the grafana-pg-init service below).
      # No depends_on postgres: a Postgres problem only empties the memory text column.
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-grafana_ro}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mem0-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      com.example.description: "Grafana dashboards for mem0-server telemetry"

  # One-shot: creates/updates the read-only role grafana_ro used by Grafana's
  # Postgres datasource (mem0-pg). Idempotent, re-runs on every `docker compose up`.
  # Grafana does not depend on it: if it fails, only the memory text column is empty.
  grafana-pg-init:
    image: pgvector/pgvector:pg16
    container_name: mem0-grafana-pg-init
    entrypoint: ["sh", "/grafana-pg-init/grafana-pg-init.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-grafana_ro}
      GRAFANA_PG_INIT_TIMEOUT_SECONDS: 300
    volumes:
      - ./monitoring/postgres/grafana-pg-init.sh:/grafana-pg-init/grafana-pg-init.sh:ro
      - ./monitoring/postgres/create-grafana-ro.sql:/grafana-pg-init/create-grafana-ro.sql:ro
    networks:
      - mem0-network
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      mem0-server:
        condition: service_healthy
    labels:
      com.example.description: "One-shot: creates the read-only Postgres role grafana_ro for Grafana"
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.3.2
    container_name: mem0-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - mem0-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      com.example.description: "Loki log store for mem0 query events (14d retention)"
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: mem0-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mem0-network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    labels:
      com.example.description: "Grafana Alloy shipping mem0-server JSON query events to Loki"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres
  mem0_history:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/mem0
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/loki

networks:
  mem0-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
